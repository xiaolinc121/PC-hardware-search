[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-hardware-search"
version = "0.2.0"
description = "PC build recommendation engine with CLI and website"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "PC Hardware Search"}]
dependencies = []

[project.optional-dependencies]
ai = ["openai>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
pc-advisor = "pc_hardware_search.cli:main"
pc-advisor-web = "pc_hardware_search.web:run_server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
